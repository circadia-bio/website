# Zenodo tracking config for the products carousel on index.qmd.
# Keyed by the product's "name" field in the carousel's JS array.
#
# zenodo_tracked: false  -> apps/infra not part of the Zenodo rollout;
#                           card keeps its current footer, no version/DOI/cite/license row.
# zenodo_tracked: true, zenodo_concept_doi: null
#                        -> package has .zenodo.json + CITATION.cff committed,
#                           but no release yet. Card shows "not yet archived"
#                           (license still shown — it doesn't depend on a release existing).
# zenodo_tracked: true, zenodo_concept_doi: "10.5281/zenodo.XXXXXXX"
#                        -> fill this in after the first GitHub release triggers
#                           the Zenodo archive. Script resolves it to get the
#                           current version + release date automatically.
#
# license: SPDX identifier, matching each repo's DESCRIPTION/.zenodo.json.

- name: "Sleep Diaries"
  zenodo_tracked: false

- name: "ScoreMe"
  zenodo_tracked: false

